<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0b0b;
            color: #f0f0f0;
            font-family: 'Noto Serif TC', serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 24 24'><text y='20' font-size='20'>🐥</text></svg>"), auto;
        }

        button, .polaroid, .lighter, .envelope, .candle, .slide-item, a {
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 24 24'><text y='20' font-size='20'>🐥</text></svg>"), pointer !important;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 40px 20px;
        }

        .page.active {
            opacity: 1;
            pointer-events: auto;
            position: relative;
        }

        /* 首頁 */
        #page-home {
            height: 100vh;
            justify-content: center;
        }

        .home-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .light-up-btn {
            background: transparent;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 14px 40px;
            font-size: 1.1rem;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: all 0.4s ease;
            font-family: 'Noto Serif TC', serif;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3), inset 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .light-up-btn:hover {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.6);
        }

        .producer-credit {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.1em;
            font-family: 'Caveat', serif;
        }

        /* 蛋糕頁面 */
        #page-cake {
            text-align: center;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 60px;
        }

        .glow-background {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.02) 65%, transparent 100%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(30px);
            top: 100px;
        }

        .stage-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            margin-bottom: 20px;
            z-index: 1;
        }

        .cake-custom-wrapper {
            position: relative;
            width: 280px;
            height: 260px;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .cake-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 15px 30px rgba(0,0,0,0.8));
        }

        .candles-container {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 2;
        }

        .candle {
            position: relative;
            width: 6px;
            height: 38px;
            border-radius: 1px;
        }
        .candle:nth-child(1) { background: #ffadad; }
        .candle:nth-child(2) { background: #ffd6a5; }
        .candle:nth-child(3) { background: #fdffb6; }
        .candle:nth-child(4) { background: #caffbf; }
        .candle:nth-child(5) { background: #9bf6ff; }

        .flame {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            width: 10px;
            height: 18px;
            background: radial-gradient(circle at 50% 80%, #fff 10%, #ffcc00 40%, #ff4500 80%);
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 12px #ff9900, 0 0 24px #ff3300;
            transition: transform 0.5s ease;
            transform-origin: bottom center;
        }

        .flame.lit {
            transform: translateX(-50%) scale(1);
            animation: flicker 1.2s infinite alternate;
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) scale(0.9) rotate(-3deg); opacity: 0.85; }
            100% { transform: translateX(-50%) scale(1.1) rotate(3deg); opacity: 1; }
        }

        .action-prompt {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 10px;
            letter-spacing: 0.15em;
            min-height: 24px;
            cursor: pointer;
            z-index: 1;
        }

        .lighter-area {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: none;
            align-items: center;
            gap: 10px;
            z-index: 10;
            user-select: none;
            touch-action: none;
        }

        .lighter-comment {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.1em;
            white-space: nowrap;
        }

        .lighter-custom {
            width: 60px;
            height: 90px;
            cursor: grab;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.8));
        }
        .lighter-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .drag-tip {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.4);
            margin-top: 10px;
            letter-spacing: 0.1em;
            z-index: 1;
        }

        .wish-text-box {
            min-height: 50px;
            text-align: center;
            margin-top: 10px;
            font-size: 1.05rem;
            letter-spacing: 0.15em;
            color: #dcdcdc;
            line-height: 1.8;
            z-index: 1;
        }

        /* 拍立得照片故事區塊（在同頁面下方漸顯） */
        .gallery-section {
            width: 100%;
            max-width: 900px;
            margin: 50px auto 0 auto;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
        }

        .gallery-section.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .gallery-title {
            font-size: 1.1rem;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 30px;
            font-weight: 300;
        }

        .polaroids-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 30px;
            width: 100%;
            padding: 0 10px;
            margin-bottom: 30px;
        }

        .polaroid {
            background: #f4f4f2;
            color: #222;
            padding: 12px 12px 20px 12px;
            border-radius: 3px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            transition: transform 0.4s;
        }

        .polaroid:hover {
            transform: translateY(-8px) rotate(1deg);
        }

        .polaroid-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            margin-bottom: 12px;
        }

        .polaroid-caption {
            font-family: 'Caveat', 'Noto Serif TC', cursive;
            font-size: 1.15rem;
            text-align: center;
            color: #333;
        }

        .gallery-actions {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
            margin-bottom: 50px;
        }

        .line-btn {
            background: #06c755;
            color: #ffffff;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            letter-spacing: 0.15em;
            border-radius: 30px;
            text-decoration: none;
            box-shadow: 0 5px 15px rgba(6, 199, 85, 0.4);
            transition: transform 0.3s, background 0.3s;
            font-family: 'Noto Serif TC', serif;
        }
        .line-btn:hover {
            background: #05b34c;
            transform: translateY(-3px);
        }

        .gallery-next-container {
            opacity: 0.3;
            pointer-events: none;
            transition: opacity 0.5s;
        }
        .gallery-next-container.unlocked {
            opacity: 1;
            pointer-events: auto;
        }

        /* 頁面四：信封信紙 */
        #page-letter {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            align-items: center;
            text-align: center;
        }

        .letter-container {
            position: relative;
            width: 100%;
            max-width: 440px;
            height: 480px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }

        .letter-paper {
            position: absolute;
            width: 340px;
            height: 420px;
            background: #fbfbf9;
            color: #2c2c2c;
            padding: 40px 30px;
            border-radius: 2px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: left;
            font-size: 0.95rem;
            line-height: 2;
            transform: translateY(0px);
            transition: transform 1.2s cubic-bezier(0.2, 1.2, 0.3, 1);
            z-index: 1;
            overflow-y: auto;
        }

        .letter-paper.pulled {
            transform: translateY(-80px);
        }

        .envelope {
            position: absolute;
            width: 360px;
            height: 240px;
            background: #232323;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 4px;
            z-index: 3;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.8s, opacity 0.8s;
        }

        .envelope.torn {
            transform: translateY(180px) scale(0.95);
            opacity: 0.2;
            pointer-events: none;
        }

        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 120px;
            background: #2a2a2a;
            clip-path: polygon(0 0, 50% 100%, 100% 0);
            transition: transform 0.6s;
            transform-origin: top;
        }

        .envelope.torn .envelope-flap {
            transform: rotateX(180deg);
        }

        .envelope-text {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.6);
            letter-spacing: 0.2em;
            margin-top: 30px;
            z-index: 4;
        }

        .next-step-container {
            margin-top: 25px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s;
        }
        .next-step-container.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .subtle-link-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Noto Serif TC', serif;
            font-size: 0.95rem;
            letter-spacing: 0.15em;
            cursor: pointer;
            padding: 8px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* 頁面五：80% 視窗大小的左右滑動相簿 */
        #page-slider {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slider-wrapper {
            position: relative;
            width: 80vw;
            height: 80vh;
            overflow: hidden;
            background: #141414;
            border-radius: 8px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .slider-track {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .slide-item {
            min-width: 80vw;
            height: 80vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .slide-img {
            width: 100%;
            height: calc(80vh - 80px);
            object-fit: cover;
        }

        .slide-caption-overlay {
            width: 100%;
            height: 80px;
            background: #181818;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            letter-spacing: 0.15em;
            color: #dcdcdc;
        }

        .slider-hint {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.5);
            letter-spacing: 0.2em;
            z-index: 10;
        }

        /* 彈窗 Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
            z-index: 100;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #141414;
            border: 1px solid rgba(255, 255, 255, 0.15);
            max-width: 480px;
            width: 100%;
            padding: 35px;
            border-radius: 4px;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            color: rgba(255,255,255,0.5);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: #f0f0f0;
        }

        .modal-story {
            font-size: 0.95rem;
            line-height: 1.8;
            color: #b5b5b5;
        }
    </style>
</head>
<body>

    <!-- 頁面一：首頁 -->
    <div id="page-home" class="page active">
        <div class="home-content">
            <button class="light-up-btn" id="btn-light-up">Light up</button>
            <div class="producer-credit">produced by small._.gg</div>
        </div>
    </div>

    <!-- 頁面二：蛋糕與打火機 -->
    <div id="page-cake" class="page">
        <div class="glow-background"></div>
        <div class="action-prompt" id="action-prompt">請點擊一下</div>

        <div class="stage-container" id="stage-container">
            <div class="cake-custom-wrapper" id="cake-wrapper">
                <!-- 對應你的檔案 ji.png -->
                <img src="ji.png" alt="Birthday Cake" class="cake-img" id="cake-img" onerror="this.src='https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=600&q=80'">
                
                <div class="candles-container">
                    <div class="candle" onclick="extinguishSingleCandle(0)"><div class="flame" id="f0"></div></div>
                    <div class="candle" onclick="extinguishSingleCandle(1)"><div class="flame" id="f1"></div></div>
                    <div class="candle" onclick="extinguishSingleCandle(2)"><div class="flame" id="f2"></div></div>
                    <div class="candle" onclick="extinguishSingleCandle(3)"><div class="flame" id="f3"></div></div>
                    <div class="candle" onclick="extinguishSingleCandle(4)"><div class="flame" id="f4"></div></div>
                </div>
            </div>

            <div class="lighter-area" id="lighter-area">
                <span class="lighter-comment">這是點蠟燭不是點煙的</span>
                <div class="lighter-custom" id="lighter" draggable="true">
                    <!-- 對應你的檔案 厂ㄍㄜ.png -->
                    <img src="厂ㄍㄜ.png" alt="Lighter" class="lighter-img" onerror="this.src='https://images.unsplash.com/photo-1527061011665-3652c757a4d4?auto=format&fit=crop&w=300&q=80'">
                </div>
            </div>
        </div>

        <div class="drag-tip" id="drag-tip" style="display:none;">拖動打火機即可點火</div>
        <div class="wish-text-box" id="wish-text-box"></div>

        <!-- 拍立得照片故事區塊（同頁面下方漸顯） -->
        <div class="gallery-section" id="gallery-section">
            <div class="gallery-title">Moments (點擊各張照片看故事)</div>
            <div class="polaroids-grid">
                <div class="polaroid" onclick="readStory(1)">
                    <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=600&q=80" class="polaroid-img">
                    <div class="polaroid-caption">那天一起走的夜路</div>
                </div>
                <div class="polaroid" onclick="readStory(2)">
                    <img src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=600&q=80" class="polaroid-img">
                    <div class="polaroid-caption">笑得很開心的小事</div>
                </div>
                <div class="polaroid" onclick="readStory(3)">
                    <img src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=600&q=80" class="polaroid-img">
                    <div class="polaroid-caption">慶祝彼此的笨拙</div>
                </div>
                <div class="polaroid" onclick="readStory(4)">
                    <img src="https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&w=600&q=80" class="polaroid-img">
                    <div class="polaroid-caption">未完待續的日常</div>
                </div>
            </div>
            
            <div class="gallery-actions">
                <!-- 「想我就打給我」LINE 按鈕 -->
                <a href="https://line.me/ti/p/rRB0-1SSeX" target="_blank" class="line-btn">想我就打給我</a>

                <div class="gallery-next-container" id="gallery-next-container">
                    <button class="light-up-btn" id="btn-goto-letter">我想好好祝福你</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 頁面四：信封信紙 -->
    <div id="page-letter" class="page">
        <div class="gallery-title">請慢慢打開信封</div>
        <div class="letter-container">
            <div class="letter-paper" id="letter-paper">
                <h3>親愛的：</h3>
                <p>希望你在每一個普通的日子裡，都能夠感受到被世界溫柔以待。不用急著成為完美的大人，只要照著自己的節奏往前走就好。願你所有的願望都能閃閃發光，生日快樂。</p>
            </div>
            <div class="envelope" id="envelope" onclick="tearEnvelope()">
                <div class="envelope-flap"></div>
                <div class="envelope-text">點擊撕開信封</div>
            </div>
        </div>
        <div class="next-step-container" id="letter-next-container">
            <button class="subtle-link-btn" id="btn-goto-slider">觀看回憶相簿</button>
        </div>
    </div>

    <!-- 頁面五：80% 視窗大小的左右滑動相簿 -->
    <div id="page-slider" class="page">
        <div class="slider-hint">← 左右滑動瀏覽回憶 →</div>
        <div class="slider-wrapper" id="slider-wrapper">
            <div class="slider-track" id="slider-track">
                <div class="slide-item">
                    <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=1200&q=80" class="slide-img">
                    <div class="slide-caption-overlay">一起走過的每一條街</div>
                </div>
                <div class="slide-item">
                    <img src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=1200&q=80" class="slide-img">
                    <div class="slide-caption-overlay">那些閃閃發光的時刻</div>
                </div>
                <div class="slide-item">
                    <img src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=1200&q=80" class="slide-img">
                    <div class="slide-caption-overlay">笑著鬧著的日常風景</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 故事彈窗 Modal -->
    <div class="modal-overlay" id="story-modal" onclick="closeStory(event)">
        <div class="modal-card" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModalDirect()">&times;</button>
            <img id="modal-img" src="" alt="Story Image" class="modal-img">
            <h3 id="modal-title" class="modal-title"></h3>
            <p id="modal-story" class="modal-story"></p>
        </div>
    </div>

    <!-- 對應你的音效檔案 xm3013.mp3 -->
    <audio id="lighter-audio" src="xm3013.mp3" preload="auto"></audio>

    <script>
        const lighterAudio = document.getElementById('lighter-audio');
        function playLighterSound() {
            try {
                lighterAudio.currentTime = 0;
                lighterAudio.play().catch(e => console.log("等待使用者互動以解鎖音訊"));
            } catch(e) {}
        }

        function playClickSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(350, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.08);
            } catch(e) {}
        }

        const pageHome = document.getElementById('page-home');
        const pageCake = document.getElementById('page-cake');
        const pageLetter = document.getElementById('page-letter');
        const pageSlider = document.getElementById('page-slider');

        document.getElementById('btn-light-up').addEventListener('click', () => {
            playClickSound();
            pageHome.classList.remove('active');
            pageCake.classList.add('active');
        });

        const actionPrompt = document.getElementById('action-prompt');
        const lighterArea = document.getElementById('lighter-area');
        const dragTip = document.getElementById('drag-tip');
        const lighter = document.getElementById('lighter');
        const flames = document.querySelectorAll('.flame');
        const wishTextBox = document.getElementById('wish-text-box');
        const stageContainer = document.getElementById('stage-container');
        const gallerySection = document.getElementById('gallery-section');

        let cakeStep = 0;
        let extinguishedCount = 0;

        stageContainer.addEventListener('click', () => {
            if (cakeStep === 0) {
                playClickSound();
                cakeStep = 1;
                lighterArea.style.display = 'flex';
                dragTip.style.display = 'block';
                actionPrompt.innerText = "請點蠟燭";
            }
        });

        actionPrompt.addEventListener('click', () => {
            if (cakeStep === 0) {
                playClickSound();
                cakeStep = 1;
                lighterArea.style.display = 'flex';
                dragTip.style.display = 'block';
                actionPrompt.innerText = "請點蠟燭";
            }
        });

        function lightTheCandles() {
            if (cakeStep < 1 || cakeStep >= 2) return;
            cakeStep = 2;
            playLighterSound();
            lighterArea.style.display = 'none';
            dragTip.style.display = 'none';
            actionPrompt.style.display = 'none';

            flames.forEach((f, index) => {
                setTimeout(() => { f.classList.add('lit'); }, index * 100);
            });

            setTimeout(() => {
                typeWriterEffect("許下願望吧，最後一個要好好的放在心裡", () => {
                    setTimeout(() => {
                        actionPrompt.style.display = 'block';
                        actionPrompt.innerText = "現在要把蠟燭的燭火點掉（點擊蠟燭即可熄滅）";
                    }, 1000);
                });
            }, 800);
        }

        lighter.addEventListener('click', lightTheCandles);

        let touchStartX = 0, touchStartY = 0;
        lighter.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
        }, {passive: true});

        lighter.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            const deltaX = touch.clientX - touchStartX;
            const deltaY = touch.clientY - touchStartY;
            lighter.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
        }, {passive: true});

        lighter.addEventListener('touchend', () => {
            lighter.style.transform = 'translate(0px, 0px)';
            lightTheCandles();
        });

        function extinguishSingleCandle(index) {
            if (cakeStep !== 2) return;
            const flame = document.getElementById(`f${index}`);
            if (flame.classList.contains('lit')) {
                playClickSound();
                flame.classList.remove('lit');
                extinguishedCount++;

                if (extinguishedCount === 5) {
                    actionPrompt.innerText = "願望已收下...";
                    setTimeout(() => {
                        gallerySection.classList.add('visible');
                        gallerySection.scrollIntoView({ behavior: 'smooth' });
                    }, 1000);
                }
            }
        }

        function typeWriterEffect(text, callback) {
            wishTextBox.innerHTML = "";
            let i = 0;
            const speed = 90;
            function type() {
                if (i < text.length) {
                    wishTextBox.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                } else {
                    if (callback) callback();
                }
            }
            type();
        }

        const stories = {
            1: { title: "那天一起走的夜路", img: "https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=600&q=80", story: "那天路燈把影子拉得長長的，我們聊了好多關於未來的迷惘與倔強。雖然腳有點酸，但那種身邊有人默默陪著、不用說話也很安心的空氣，至今想起來都還是覺得暖暖的。" },
            2: { title: "笑得很開心的小事", img: "https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=600&q=80", story: "因為一件超級無聊的小笑話在路邊笑了好久。生活其實常常擠滿了讓人喘不過氣的瑣事，但只要跟你在一起，總能輕易找回那些最單純、最不加修飾的快樂。" },
            3: { title: "慶祝彼此的笨拙", img: "https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=600&q=80", story: "我們都不是那種完美的大人，常常跌跌撞撞，把生活過得亂七八糟又充滿驚喜。但慶幸的是，每一次狼狽的時候，身邊都有彼此懂那種笑中帶淚的默契。" },
            4: { title: "未完待續的日常", img: "https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&w=600&q=80", story: "不用許太大太遠的願望，只要每一個重要或不重要的日子裡，我們都能像這樣，繼續保持真實、繼續往前走。生日快樂呀。" }
        };

        const modalOverlay = document.getElementById('story-modal');
        const modalImg = document.getElementById('modal-img');
        const modalTitle = document.getElementById('modal-title');
        const modalStory = document.getElementById('modal-story');
        let readStoriesCount = new Set();

        function readStory(id) {
            playClickSound();
            const data = stories[id];
            if (!data) return;
            modalImg.src = data.img;
            modalTitle.innerText = data.title;
            modalStory.innerText = data.story;
            modalOverlay.classList.add('active');

            readStoriesCount.add(id);
            if (readStoriesCount.size === 4) {
                document.getElementById('gallery-next-container').classList.add('unlocked');
            }
        }

        function closeModalDirect() {
            playClickSound();
            modalOverlay.classList.remove('active');
        }

        function closeStory(e) {
            if (e.target === modalOverlay) {
                modalOverlay.classList.remove('active');
            }
        }

        document.getElementById('btn-goto-letter').addEventListener('click', () => {
            playClickSound();
            pageCake.classList.remove('active');
            pageLetter.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        function tearEnvelope() {
            playClickSound();
            document.getElementById('envelope').classList.add('torn');
            document.getElementById('letter-paper').classList.add('pulled');
            setTimeout(() => {
                document.getElementById('letter-next-container').classList.add('visible');
            }, 1000);
        }

        document.getElementById('btn-goto-slider').addEventListener('click', () => {
            playClickSound();
            pageLetter.classList.remove('active');
            pageSlider.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        /* 80% 視窗大小的左右滑動相簿互動控制 */
        let currentSlide = 0;
        const totalSlides = 3;
        const sliderTrack = document.getElementById('slider-track');
        const sliderWrapper = document.getElementById('slider-wrapper');

        function updateSlide() {
            playClickSound();
            sliderTrack.style.transform = `translateX(-${currentSlide * sliderWrapper.offsetWidth}px)`;
        }

        let startX = 0;
        let isDragging = false;

        sliderWrapper.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            isDragging = true;
        }, {passive: true});

        sliderWrapper.addEventListener('touchend', (e) => {
            if (!isDragging) return;
            const endX = e.changedTouches[0].clientX;
            const diff = startX - endX;

            if (diff > 50) {
                if (currentSlide < totalSlides - 1) {
                    currentSlide++;
                    updateSlide();
                }
            } else if (diff < -50) {
                if (currentSlide > 0) {
                    currentSlide--;
                    updateSlide();
                }
            }
            isDragging = false;
        });

        sliderWrapper.addEventListener('click', (e) => {
            const rect = sliderWrapper.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            if (clickX > rect.width / 2) {
                if (currentSlide < totalSlides - 1) {
                    currentSlide++;
                    updateSlide();
                }
            } else {
                if (currentSlide > 0) {
                    currentSlide--;
                    updateSlide();
                }
            }
        });
    </script>
</body>
</html>
