<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Happy Birthday</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&family=Noto+Sans+TC:wght@400;500;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}:root{--ink:#f8edf5;--pink:#ffb7d5;--lav:#d8c6ff;--mint:#b8f1df;--gold:#ffe5a8;--night:#171321}body{background:radial-gradient(ellipse at 18% 15%,#352546 0%,transparent 38%),radial-gradient(ellipse at 85% 85%,#263744 0%,transparent 40%),var(--night);color:var(--ink);font-family:'Noto Sans TC',sans-serif;width:100vw;min-height:100vh;overflow-x:hidden}.stage-section{position:absolute;inset:0;width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 1.2s cubic-bezier(.4,0,.2,1);padding:20px}.stage-section.active{opacity:1;pointer-events:auto}#section-home{z-index:10}#section-cake{z-index:9}#section-gallery{z-index:8}#section-letter{z-index:7}#section-slider{z-index:6}.home-content{display:flex;flex-direction:column;align-items:center;gap:16px}.light-up-btn{background:linear-gradient(135deg,#fff1f7,#f3eaff);color:#4b3659;border:2px solid #fff9;padding:14px 40px;font-size:1.1rem;letter-spacing:.16em;transition:transform .25s,box-shadow .25s;font-family:inherit;border-radius:999px;box-shadow:0 6px 0 #c6a9d8,0 12px 26px rgba(0,0,0,.25);cursor:pointer}.light-up-btn:hover{transform:translateY(-3px) rotate(-1deg);box-shadow:0 9px 0 #c6a9d8,0 16px 30px rgba(0,0,0,.3)}.sound-hint{font-family:'Caveat','Noto Serif TC',serif;font-size:1.3rem;letter-spacing:.08em;color:#fff9f5;text-shadow:0 2px 8px rgba(0,0,0,.7)}.producer-credit{font-size:.85rem;color:rgba(255,255,255,.7);letter-spacing:.1em;font-family:'Caveat','Noto Serif TC',serif}.gallery-title{font-size:1rem;letter-spacing:.14em;color:#fff;margin-bottom:20px;font-weight:500;text-shadow:0 2px 8px rgba(0,0,0,.7);text-align:center}.polaroids-grid{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:20px;max-width:900px;width:100%;margin-bottom:30px;padding:0 10px}.polaroid{background:#f4f4f2;color:#29232e;padding:10px 10px 15px;border-radius:3px;box-shadow:0 10px 25px rgba(0,0,0,.45);transition:transform .3s ease;cursor:pointer;border:1px solid rgba(255,255,255,.15)}.polaroid:hover{transform:translateY(-5px) rotate(1deg)}.polaroid-img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;border-radius:2px}.polaroid-caption{font-family:'Caveat','Noto Serif TC',cursive;font-size:1rem;text-align:center;color:#493b50;margin-top:8px}.section-next-container{opacity:0;pointer-events:none;transition:opacity .5s ease}.section-next-container.unlocked{opacity:1;pointer-events:auto}.modal-overlay{position:fixed;inset:0;width:100%;height:100%;background:rgba(21,16,27,.85);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s ease;z-index:1000;padding:20px}.modal-overlay.active{opacity:1;pointer-events:auto}.modal-card{background:#2a2232;border:1px solid rgba(255,255,255,.35);max-width:900px;width:min(90vw,900px);padding:30px;border-radius:12px;position:relative;box-shadow:0 16px 50px rgba(0,0,0,.6)}.modal-close{position:absolute;top:15px;right:20px;background:none;border:0;color:#fff;font-size:1.8rem;cursor:pointer}.modal-img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;border-radius:3px;margin-bottom:15px}.modal-title{font-size:1.2rem;margin-bottom:10px;color:#fff;font-weight:700}.modal-story{font-size:.95rem;line-height:1.7;color:#f0e5f1}@media(max-width:700px){.polaroids-grid{grid-template-columns:repeat(2,minmax(140px,1fr));gap:12px}.modal-card{padding:22px 18px 18px}} </style>
</head>
<body>
<div id="section-home" class="stage-section active"><div class="home-content"><button class="light-up-btn" id="btn-light-up">Light up</button><div class="sound-hint">open the sound</div><div class="producer-credit">produced by small._.gg</div></div></div>
<div id="section-gallery" class="stage-section"><div class="gallery-title">Moments (點擊各張照片看故事)</div><div class="polaroids-grid"><div class="polaroid" tabindex="0" data-id="1"><img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=1080&h=1080&q=80" class="polaroid-img" alt="回憶照片"><div class="polaroid-caption">那天一起走的夜路</div></div><div class="polaroid" tabindex="0" data-id="2"><img src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=1080&h=1080&q=80" class="polaroid-img" alt="回憶照片"><div class="polaroid-caption">笑得很開心的小事</div></div><div class="polaroid" tabindex="0" data-id="3"><img src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=1080&h=1080&q=80" class="polaroid-img" alt="回憶照片"><div class="polaroid-caption">慶祝彼此的笨拙</div></div><div class="polaroid" tabindex="0" data-id="4"><img src="https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&w=1080&h=1080&q=80" class="polaroid-img" alt="回憶照片"><div class="polaroid-caption">未完待續的日常</div></div></div><div class="section-next-container" id="gallery-next-container"><button class="light-up-btn" id="btn-goto-letter">我想好好祝福你</button></div></div>
<div class="modal-overlay" id="story-modal"><div class="modal-card" onclick="event.stopPropagation()"><button class="modal-close" onclick="closeModalDirect()" aria-label="關閉">×</button><img id="modal-img" class="modal-img" src="" alt="故事圖片"><h3 id="modal-title" class="modal-title"></h3><p id="modal-story" class="modal-story"></p></div></div>
<script>
const stories={1:{title:'抽菸啊',img:'抽菸.png',story:'我們在很多地方抽著菸，咖啡廳、畫外音，抽著抽著就在一起了，年紀不小了，記得克制點，注意身體健康'},2:{title:'做過了好多事呢',img:'花花.png',story:'我們看過了不少電影、聽過了不少的音樂，也很謝謝你在這一年陪我去很多很多展覽喔！你覺得這麼不一樣的世界有趣嗎？我是滿喜歡的啦'},3:{title:'奇奇怪怪的你和我',img:'奇怪自拍.png',story:'我其實一直都知道你很在乎你的外表，我也是，你害怕著鏡頭，我懂那種不敢照鏡子的感覺，就是因為我知道，所以才想著透過奇奇怪怪的拍照方式讓你稍微習慣一點吧，也多少記錄一下我們，希望在接下來的時間你還是可以慢慢練習，慢慢習慣'},4:{title:'要長大了喔',img:'分開.png',story:'長大就是開始學會習��那些可能不會太舒服的事情，或許是分開，或許是再見，或許是逐漸接受那些原本這輩子都不可能接受的事情，但你是陳正義欸，我知道你不會妥協的，所以繼續保持吧！生日快樂！'}};const modal=document.getElementById('story-modal'),modalImg=document.getElementById('modal-img'),modalTitle=document.getElementById('modal-title'),modalStory=document.getElementById('modal-story'),galleryNext=document.getElementById('gallery-next-container'),readStories=new Set();function openStory(id){const d=stories[id];if(!d)return;modalImg.src=d.img;modalTitle.textContent=d.title;modalStory.textContent=d.story;modal.classList.add('active');readStories.add(id);if(readStories.size===4)galleryNext.classList.add('unlocked')}function closeModalDirect(){modal.classList.remove('active')}function closeStory(e){if(e.target===modal)modal.classList.remove('active')}document.querySelectorAll('.polaroid').forEach(item=>{item.addEventListener('click',()=>openStory(Number(item.dataset.id)));item.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openStory(Number(item.dataset.id))}})});modal.addEventListener('click',closeStory);document.getElementById('btn-light-up').addEventListener('click',()=>{document.getElementById('section-home').classList.remove('active');document.getElementById('section-gallery').classList.add('active')});
</script>
</body>
</html>
