<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0b0b;
            color: #f0f0f0;
            font-family: 'Noto Serif TC', serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 40px 20px;
        }

        .page.active {
            opacity: 1;
            pointer-events: auto;
            position: relative;
        }

        /* ================= 頁面一：首頁 ================= */
        #page-home {
            height: 100vh;
            justify-content: center;
        }

        .home-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .light-up-btn {
            background: transparent;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 14px 40px;
            font-size: 1.1rem;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: all 0.4s ease;
            font-family: 'Noto Serif TC', serif;
            border-radius: 4px;
            /* 白色螢光效果 */
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3), inset 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .light-up-btn:hover {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.4);
        }

        .producer-credit {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.1em;
            font-family: 'Caveat', serif;
        }

        /* ================= 頁面二：蛋糕與打火機 ================= */
        #page-cake {
            text-align: center;
        }

        .stage-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        /* 桌子 */
        .table {
            position: absolute;
            bottom: 0;
            width: 360px;
            height: 16px;
            background: #1f1f1f;
            border-radius: 4px;
            border-bottom: 2px solid #333;
        }

        /* 雙層白色奶油蛋糕 */
        .cake-wrapper {
            position: relative;
            width: 260px;
            height: 200px;
            margin-bottom: 16px;
        }

        /* 底層蛋糕 */
        .cake-tier-bottom {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 110px;
            background: #fdfdfd;
            border-radius: 8px 8px 4px 4px;
            box-shadow: inset -10px 0 20px rgba(0,0,0,0.1), 0 5px 15px rgba(0,0,0,0.5);
        }

        .cake-tier-bottom-cream {
            position: absolute;
            top: 0;
            width: 100%;
            height: 25px;
            background: #fff;
            border-radius: 8px 8px 0 0;
            border-bottom: 2px solid #eee;
        }

        /* 上層蛋糕 */
        .cake-tier-top {
            position: absolute;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 80px;
            background: #fdfdfd;
            border-radius: 8px 8px 4px 4px;
            box-shadow: inset -8px 0 15px rgba(0,0,0,0.1);
        }

        .cake-tier-top-cream {
            position: absolute;
            top: 0;
            width: 100%;
            height: 20px;
            background: #fff;
            border-radius: 8px 8px 0 0;
            border-bottom: 2px solid #eee;
        }

        /* 草莓點綴 */
        .strawberry {
            position: absolute;
            width: 14px;
            height: 16px;
            background: #d32f2f;
            border-radius: 50% 50% 40% 40%;
            box-shadow: inset -2px -2px 4px rgba(0,0,0,0.3);
        }
        .strawberry::after {
            content: '';
            position: absolute;
            top: 1px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 4px;
            background: #4caf50;
            border-radius: 2px;
        }
        /* 上層草莓 */
        .s1 { top: -12px; left: 30px; }
        .s2 { top: -14px; left: 80px; }
        .s3 { top: -12px; right: 30px; }
        /* 底層草莓 */
        .s4 { bottom: 102px; left: 20px; }
        .s5 { bottom: 102px; right: 20px; }

        /* 七彩五支細蠟燭容器 */
        .candles-container {
            position: absolute;
            bottom: 190px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 50px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 10px;
        }

        .candle {
            position: relative;
            width: 6px;
            height: 45px;
            border-radius: 2px;
        }

        /* 七彩顏色 */
        .candle:nth-child(1) { background: #ffadad; }
        .candle:nth-child(2) { background: #ffd6a5; }
        .candle:nth-child(3) { background: #fdffb6; }
        .candle:nth-child(4) { background: #caffbf; }
        .candle:nth-child(5) { background: #9bf6ff; }

        /* 火焰 */
        .flame {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            width: 10px;
            height: 18px;
            background: radial-gradient(circle at 50% 80%, #fff 10%, #ffcc00 40%, #ff4500 80%);
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 10px #ff9900, 0 0 20px #ff3300;
            transition: transform 0.5s ease;
            transform-origin: bottom center;
        }

        .flame.lit {
            transform: translateX(-50%) scale(1);
            animation: flicker 1.2s infinite alternate;
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) scale(0.9) rotate(-3deg); opacity: 0.85; }
            100% { transform: translateX(-50%) scale(1.1) rotate(3deg); opacity: 1; }
        }

        /* 互動提示文字 */
        .action-prompt {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 15px;
            letter-spacing: 0.15em;
            min-height: 24px;
            cursor: pointer;
        }

        /* 打火機 */
        .lighter {
            position: absolute;
            bottom: 30px;
            right: 25px;
            width: 48px;
            height: 85px;
            background: #2a2a2a;
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 6px;
            cursor: pointer;
            display: none; /* 預設隱藏，點擊畫面後出現 */
            flex-direction: column;
            align-items: center;
            padding-top: 6px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7);
            user-select: none;
            touch-action: none;
            z-index: 10;
            transition: transform 0.2s;
        }

        .lighter:active {
            transform: scale(0.95);
        }

        .lighter-top {
            width: 22px;
            height: 12px;
            background: #555;
            border-radius: 2px;
        }

        .lighter-body-label {
            font-size: 8.5px;
            color: rgba(255,255,255,0.6);
            writing-mode: vertical-rl;
            margin-top: 10px;
            letter-spacing: 1px;
            text-align: center;
            line-height: 1.2;
        }

        /* 打字機文字區 */
        .wish-text-box {
            min-height: 50px;
            text-align: center;
            margin-top: 10px;
            font-size: 1.05rem;
            letter-spacing: 0.15em;
            color: #dcdcdc;
            line-height: 1.8;
        }

        .next-step-container {
            margin-top: 25px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
        }
        .next-step-container.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .subtle-link-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Noto Serif TC', serif;
            font-size: 0.95rem;
            letter-spacing: 0.15em;
            cursor: pointer;
            padding: 8px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s;
        }
        .subtle-link-btn:hover {
            color: #fff;
            border-color: #fff;
        }

        /* ================= 頁面三：拍立得藝廊 ================= */
        #page-gallery {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            align-items: center;
        }

        .gallery-title {
            font-size: 1.1rem;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 40px;
            font-weight: 300;
        }

        .polaroids-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 30px;
            width: 100%;
            padding: 0 10px;
            margin-bottom: 50px;
        }

        .polaroid {
            background: #f4f4f2;
            color: #222;
            padding: 12px 12px 20px 12px;
            border-radius: 3px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.4s;
            position: relative;
        }

        .polaroid:hover {
            transform: translateY(-8px) rotate(1deg);
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
        }

        .polaroid-img {
            width: 100%;
            height: 160px;
            background: #2a2a2a;
            object-fit: cover;
            margin-bottom: 12px;
            filter: grayscale(20%) contrast(105%);
        }

        .polaroid-caption {
            font-family: 'Caveat', 'Noto Serif TC', cursive;
            font-size: 1.15rem;
            text-align: center;
            color: #333;
            letter-spacing: 0.05em;
        }

        /* 彈窗 Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 100;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #141414;
            border: 1px solid rgba(255, 255, 255, 0.15);
            max-width: 480px;
            width: 100%;
            padding: 35px;
            border-radius: 4px;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.9);
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            color: rgba(255,255,255,0.5);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.3s;
        }
        .modal-close:hover {
            color: #fff;
        }

        .modal-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            margin-bottom: 20px;
            border-radius: 2px;
        }

        .modal-title {
            font-size: 1.1rem;
            letter-spacing: 0.1em;
            margin-bottom: 12px;
            color: #f0f0f0;
        }

        .modal-story {
            font-size: 0.95rem;
            line-height: 1.8;
            color: #b5b5b5;
            letter-spacing: 0.05em;
        }

        @media (max-width: 600px) {
            .polaroids-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
            .polaroid-img {
                height: 130px;
            }
        }
    </style>
</head>
<body>

    <!-- 頁面一：首頁 -->
    <div id="page-home" class="page active">
        <div class="home-content">
            <button class="light-up-btn" id="btn-light-up">Light up</button>
            <div class="producer-credit">produced by small._.gg</div>
        </div>
    </div>

    <!-- 頁面二：蛋糕、打火機、點蠟燭與許願 -->
    <div id="page-cake" class="page">
        <!-- 提示文字放在上方 -->
        <div class="action-prompt" id="action-prompt">請點擊一下</div>

        <div class="stage-container" id="stage-container">
            <!-- 雙層白色奶油蛋糕 -->
            <div class="cake-wrapper" id="cake-wrapper">
                <!-- 上層草莓 -->
                <div class="strawberry s1"></div>
                <div class="strawberry s2"></div>
                <div class="strawberry s3"></div>
                <!-- 底層草莓 -->
                <div class="strawberry s4"></div>
                <div class="strawberry s5"></div>

                <div class="cake-tier-top">
                    <div class="cake-tier-top-cream"></div>
                </div>
                <div class="cake-tier-bottom">
                    <div class="cake-tier-bottom-cream"></div>
                </div>

                <!-- 五支七彩蠟燭 -->
                <div class="candles-container">
                    <div class="candle"><div class="flame" id="f1"></div></div>
                    <div class="candle"><div class="flame" id="f2"></div></div>
                    <div class="candle"><div class="flame" id="f3"></div></div>
                    <div class="candle"><div class="flame" id="f4"></div></div>
                    <div class="candle"><div class="flame" id="f5"></div></div>
                </div>
            </div>

            <div class="table"></div>

            <!-- 打火機（可拖曳或點擊） -->
            <div class="lighter" id="lighter" draggable="true">
                <div class="lighter-top"></div>
                <div class="lighter-body-label">這是點蠟燭不是點煙的</div>
            </div>
        </div>

        <!-- 打字機文字區 -->
        <div class="wish-text-box" id="wish-text-box"></div>

        <!-- 最後跳轉按鈕 -->
        <div class="next-step-container" id="next-step-container">
            <button class="subtle-link-btn" id="btn-goto-gallery">一年前我們也是這樣過生日了</button>
        </div>
    </div>

    <!-- 頁面三：拍立得藝廊 -->
    <div id="page-gallery" class="page">
        <div class="gallery-title">Moments</div>
        <div class="polaroids-grid">
            <div class="polaroid" onclick="openStory(1)">
                <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=600&q=80" alt="Memory 1" class="polaroid-img">
                <div class="polaroid-caption">那天一起走的夜路</div>
            </div>
            <div class="polaroid" onclick="openStory(2)">
                <img src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=600&q=80" alt="Memory 2" class="polaroid-img">
                <div class="polaroid-caption">笑得很開心的小事</div>
            </div>
            <div class="polaroid" onclick="openStory(3)">
                <img src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=600&q=80" alt="Memory 3" class="polaroid-img">
                <div class="polaroid-caption">慶祝彼此的笨拙</div>
            </div>
            <div class="polaroid" onclick="openStory(4)">
                <img src="https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&w=600&q=80" alt="Memory 4" class="polaroid-img">
                <div class="polaroid-caption">未完待續的日常</div>
            </div>
        </div>
    </div>

    <!-- 故事細節彈窗 Modal -->
    <div class="modal-overlay" id="story-modal" onclick="closeStory(event)">
        <div class="modal-card" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModalDirect()">&times;</button>
            <img id="modal-img" src="" alt="Story Image" class="modal-img">
            <h3 id="modal-title" class="modal-title"></h3>
            <p id="modal-story" class="modal-story"></p>
        </div>
    </div>

    <script>
        // --- 頁面跳轉控制 ---
        const pageHome = document.getElementById('page-home');
        const pageCake = document.getElementById('page-cake');
        const pageGallery = document.getElementById('page-gallery');

        const actionPrompt = document.getElementById('action-prompt');
        const lighter = document.getElementById('lighter');
        const flames = document.querySelectorAll('.flame');
        const wishTextBox = document.getElementById('wish-text-box');
        const nextStepContainer = document.getElementById('next-step-container');
        const stageContainer = document.getElementById('stage-container');

        let step = 0; // 0: 剛進來, 1: 點擊後出現打火機, 2: 已點燃蠟燭
        let audioCtx = null;

        // 播放打火機點擊音效 (Web Audio API 模擬清脆喀噠聲)
        function playClickSound() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch(e) {
                // 忽略音效錯誤
            }
        }

        document.getElementById('btn-light-up').addEventListener('click', () => {
            pageHome.classList.remove('active');
            pageCake.classList.add('active');
        });

        // 點擊舞台或提示文字推進互動
        stageContainer.addEventListener('click', (e) => {
            if (step === 0) {
                playClickSound();
                step = 1;
                lighter.style.display = 'flex';
                actionPrompt.innerText = "請點蠟燭";
            }
        });

        actionPrompt.addEventListener('click', () => {
            if (step === 0) {
                playClickSound();
                step = 1;
                lighter.style.display = 'flex';
                actionPrompt.innerText = "請點蠟燭";
            }
        });

        // 點擊打火機或拖曳打火機到蛋糕上來點燃蠟燭
        function lightTheCandles() {
            if (step < 1 || step >= 2) return;
            step = 2;
            playClickSound();
            lighter.style.display = 'none';
            actionPrompt.style.display = 'none';

            // 點燃所有蠟燭火焰
            flames.forEach((f, index) => {
                setTimeout(() => {
                    f.classList.add('lit');
                }, index * 100);
            });

            // 打字機出現許願文字
            setTimeout(() => {
                typeWriterEffect("許下願望吧，最後一個要好好的放在心裡", () => {
                    nextStepContainer.classList.add('visible');
                });
            }, 800);
        }

        lighter.addEventListener('click', lightTheCandles);

        // 桌面端拖曳支援
        lighter.addEventListener('dragstart', (e) => {
            e.dataTransfer.setData('text/plain', 'lighter');
        });

        const cakeWrapper = document.getElementById('cake-wrapper');
        cakeWrapper.addEventListener('dragover', (e) => { e.preventDefault(); });
        cakeWrapper.addEventListener('drop', (e) => {
            e.preventDefault();
            lightTheCandles();
        });

        // 手機端觸控打火機點燃
        let touchStartX = 0, touchStartY = 0;
        lighter.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
        }, {passive: true});

        lighter.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            const deltaX = touch.clientX - touchStartX;
            const deltaY = touch.clientY - touchStartY;
            lighter.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
        }, {passive: true});

        lighter.addEventListener('touchend', () => {
            lighter.style.transform = 'translate(0px, 0px)';
            lightTheCandles();
        });

        // 跳轉至相框藝廊頁面
        document.getElementById('btn-goto-gallery').addEventListener('click', () => {
            pageCake.classList.remove('active');
            pageGallery.classList.add('active');
        });

        // 打字機特效
        function typeWriterEffect(text, callback) {
            wishTextBox.innerHTML = "";
            let i = 0;
            const speed = 100;
            function type() {
                if (i < text.length) {
                    wishTextBox.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                } else {
                    if (callback) callback();
                }
            }
            type();
        }

        // --- 拍立得故事彈窗邏輯 ---
        const stories = {
            1: {
                title: "那天一起走的夜路",
                img: "https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=600&q=80",
                story: "那天路燈把影子拉得長長的，我們聊了好多關於未來的迷惘與倔強。雖然腳有點酸，但那種身邊有人默默陪著、不用說話也很安心的空氣，至今想起來都還是覺得暖暖的。"
            },
            2: {
                title: "笑得很開心的小事",
                img: "https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=600&q=80",
                story: "因為一件超級無聊的小笑話在路邊笑了好久。生活其實常常擠滿了讓人喘不過氣的瑣事，但只要跟你在一起，總能輕易找回那些最單純、最不加修飾的快樂。"
            },
            3: {
                title: "慶祝彼此的笨拙",
                img: "https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=600&q=80",
                story: "我們都不是那種完美的大人，常常跌跌撞撞，把生活過得亂七八糟又充滿驚喜。但慶幸的是，每一次狼狽的時候，身邊都有彼此懂那種笑中帶淚的默契。"
            },
            4: {
                title: "未完待續的日常",
                img: "https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&w=600&q=80",
                story: "不用許太大太遠的願望，只要每一個重要或不重要的日子裡，我們都能像這樣，繼續保持真實、繼續往前走。生日快樂呀。"
            }
        };

        const modalOverlay = document.getElementById('story-modal');
        const modalImg = document.getElementById('modal-img');
        const modalTitle = document.getElementById('modal-title');
        const modalStory = document.getElementById('modal-story');

        function openStory(id) {
            const data = stories[id];
            if (!data) return;
            modalImg.src = data.img;
            modalTitle.innerText = data.title;
            modalStory.innerText = data.story;
            modalOverlay.classList.add('active');
        }

        function closeModalDirect() {
            modalOverlay.classList.remove('active');
        }

        function closeStory(e) {
            if (e.target === modalOverlay) {
                modalOverlay.classList.remove('active');
            }
        }
    </script>
