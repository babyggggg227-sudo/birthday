<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* 全域可愛小雞鼠標 */
        body {
            background-color: #0b0b0b;
            color: #f0f0f0;
            font-family: 'Noto Serif TC', serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 24 24'><text y='20' font-size='20'>🐥</text></svg>"), auto;
        }

        button, .polaroid, .lighter, .envelope-wrapper, .candle, .slide-item {
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 24 24'><text y='20' font-size='20'>🐥</text></svg>"), pointer !important;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 40px 20px;
        }

        .page.active {
            opacity: 1;
            pointer-events: auto;
            position: relative;
        }

        /* ================= 頁面一：首頁 ================= */
        #page-home {
            height: 100vh;
            justify-content: center;
        }

        .home-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .light-up-btn {
            background: transparent;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 14px 40px;
            font-size: 1.1rem;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: all 0.4s ease;
            font-family: 'Noto Serif TC', serif;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3), inset 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .light-up-btn:hover {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.4);
        }

        .producer-credit {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.1em;
            font-family: 'Caveat', serif;
        }

        /* ================= 頁面二：蛋糕與打火機 ================= */
        #page-cake {
            text-align: center;
            position: relative;
        }

        .glow-background {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.02) 65%, transparent 100%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(30px);
        }

        .stage-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            margin-bottom: 20px;
            z-index: 1;
        }

        .cake-custom-wrapper {
            position: relative;
            width: 280px;
            height: 260px;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .cake-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 15px 30px rgba(0,0,0,0.8));
        }

        .candles-container {
            position: absolute;
            top: 65px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 2;
        }

        .candle {
            position: relative;
            width: 6px;
            height: 38px;
            border-radius: 1px;
        }
        .candle:nth-child(1) { background: #ffadad; }
        .candle:nth-child(2) { background: #ffd6a5; }
        .candle:nth-child(3) { background: #fdffb6; }
        .candle:nth-child(4) { background: #caffbf; }
        .candle:nth-child(5) { background: #9bf6ff; }

        .flame {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            width: 10px;
            height: 18px;
            background: radial-gradient(circle at 50% 80%, #fff 10%, #ffcc00 40%, #ff4500 80%);
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 12px #ff9900, 0 0 24px #ff3300;
            transition: transform 0.5s ease;
            transform-origin: bottom center;
        }

        .flame.lit {
            transform: translateX(-50%) scale(1);
            animation: flicker 1.2s infinite alternate;
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) scale(0.9) rotate(-3deg); opacity: 0.85; }
            100% { transform: translateX(-50%) scale(1.1) rotate(3deg); opacity: 1; }
        }

        .action-prompt {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 10px;
            letter-spacing: 0.15em;
            min-height: 24px;
            cursor: pointer;
            z-index: 1;
        }

        .lighter-area {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: none;
            align-items: center;
            gap: 10px;
            z-index: 10;
            user-select: none;
            touch-action: none;
        }

        .lighter-comment {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.1em;
            white-space: nowrap;
            font-family: 'Noto Serif TC', serif;
        }

        .lighter-custom {
            width: 60px;
            height: 90px;
            cursor: grab;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.8));
            transition: transform 0.2s;
        }
        .lighter-custom:active {
            cursor: grabbing;
        }
        .lighter-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .drag-tip {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.4);
            margin-top: 10px;
            letter-spacing: 0.1em;
            z-index: 1;
        }

        .wish-text-box {
            min-height: 50px;
            text-align: center;
            margin-top: 10px;
            font-size: 1.05rem;
            letter-spacing: 0.15em;
            color: #dcdcdc;
            line-height: 1.8;
            z-index: 1;
        }

        /* ================= 頁面三：拍立得藝廊 ================= */
        #page-gallery {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            align-items: center;
        }

        .gallery-title {
            font-size: 1.1rem;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 40px;
            font-weight: 300;
        }

        .polaroids-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 30px;
            width: 100%;
            padding: 0 10px;
            margin-bottom: 30px;
        }

        .polaroid {
            background: #f4f4f2;
            color: #222;
            padding: 12px 12px 20px 12px;
            border-radius: 3px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.4s;
            position: relative;
        }

        .polaroid:hover {
            transform: translateY(-8px) rotate(1deg);
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
        }

        .polaroid-img {
            width: 100%;
            height: 160px;
            background: #2a2a2a;
            object-fit: cover;
            margin-bottom: 12px;
            filter: grayscale(20%) contrast(105%);
        }

        .polaroid-caption {
            font-family: 'Caveat', 'Noto Serif TC', cursive;
            font-size: 1.15rem;
            text-align: center;
            color: #333;
            letter-spacing: 0.05em;
        }

        .gallery-next-container {
            margin-top: 20px;
            opacity: 0.3;
            pointer-events: none;
            transition: opacity 0.5s;
        }
        .gallery-next-container.unlocked {
            opacity: 1;
            pointer-events: auto;
        }

        /* ================= 頁面四：信封信紙 ================= */
        #page-letter {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            align-items: center;
            text-align: center;
        }

        .letter-container {
            position: relative;
            width: 100%;
            max-width: 440px;
            height: 480px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }

        .letter-paper {
            position: absolute;
            width: 340px;
            height: 420px;
            background: #fbfbf9;
            color: #2c2c2c;
            padding: 40px 30px;
            border-radius: 2px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: left;
            font-size: 0.95rem;
            line-height: 2;
            letter-spacing: 0.08em;
            transform: translateY(0px);
            transition: transform 1.2s cubic-bezier(0.2, 1.2, 0.3, 1), box-shadow 1.2s;
            z-index: 1;
            overflow-y: auto;
        }

        .letter-paper.pulled {
            transform: translateY(-80px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .letter-paper h3 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            letter-spacing: 0.15em;
            color: #111;
        }

        .envelope {
            position: absolute;
            width: 360px;
            height: 240px;
            background: #232323;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 4px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            z-index: 3;
            cursor: pointer;
            transition: transform 0.8s ease, opacity 0.8s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .envelope.torn {
            transform: translateY(180px) scale(0.95);
            opacity: 0.2;
            pointer-events: none;
        }

        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 120px;
            background: #2a2a2a;
            clip-path: polygon(0 0, 50% 100%, 100% 0);
            border-top: 1px solid rgba(255,255,255,0.2);
            transition: transform 0.6s ease;
            transform-origin: top;
        }

        .envelope.torn .envelope-flap {
            transform: rotateX(180deg);
        }

        .envelope-text {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.6);
            letter-spacing: 0.2em;
            margin-top: 30px;
            z-index: 4;
        }

        .next-step-container {
            margin-top: 25px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
        }
        .next-step-container.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .subtle-link-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Noto Serif TC', serif;
            font-size: 0.95rem;
            letter-spacing: 0.15em;
            cursor: pointer;
            padding: 8px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s;
        }
        .subtle-link-btn:hover {
            color: #fff;
            border-color: #fff;
        }

        /* ================= 頁面五：80% 視窗大小的左右滑動相簿 ================= */
        #page-slider {
            width: 100vw;
            height: 100vh;
            max-width: none;
            margin: 0;
            padding:
