<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* 全域可愛小雞鼠標 */
        body {
            background-color: #0b0b0b;
            color: #f0f0f0;
            font-family: 'Noto Serif TC', serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 24 24'><text y='20' font-size='20'>🐥</text></svg>"), auto;
        }

        button, .polaroid, .lighter, .envelope-wrapper, .candle, .slide-item {
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 24 24'><text y='20' font-size='20'>🐥</text></svg>"), pointer !important;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 40px 20px;
        }

        .page.active {
            opacity: 1;
            pointer-events: auto;
            position: relative;
        }

        /* ================= 頁面一：首頁 ================= */
        #page-home {
            height: 100vh;
            justify-content: center;
        }

        .home-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .light-up-btn {
            background: transparent;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 14px 40px;
            font-size: 1.1rem;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: all 0.4s ease;
            font-family: 'Noto Serif TC', serif;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3), inset 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .light-up-btn:hover {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.4);
        }

        .producer-credit {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.1em;
            font-family: 'Caveat', serif;
        }

        /* ================= 頁面二：蛋糕與打火機 ================= */
        #page-cake {
            text-align: center;
            position: relative;
        }

        .glow-background {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.02) 65%, transparent 100%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(30px);
        }

        .stage-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            margin-bottom: 20px;
            z-index: 1;
        }

        .cake-custom-wrapper {
            position: relative;
            width: 280px;
            height: 260px;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .cake-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 15px 30px rgba(0,0,0,0.8));
        }

        /* 精準對齊蛋糕上方的五支蠟燭 */
        .candles-container {
            position: absolute;
            top: 65px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 2;
        }

        .candle {
            position: relative;
            width: 6px;
            height: 38px;
            border-radius: 1px;
        }
        .candle:nth-child(1) { background: #ffadad; }
        .candle:nth-child(2) { background: #ffd6a5; }
        .candle:nth-child(3) { background: #fdffb6; }
        .candle:nth-child(4) { background: #caffbf; }
        .candle:nth-child(5) { background: #9bf6ff; }

        .flame {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            width: 10px;
            height: 18px;
            background: radial-gradient(circle at 50% 80%, #fff 10%, #ffcc00 40%, #ff4500 80%);
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 12px #ff9900, 0 0 24px #ff3300;
            transition: transform 0.5s ease;
            transform-origin: bottom center;
        }

        .flame.lit {
            transform: translateX(-50%) scale(1);
            animation: flicker 1.2s infinite alternate;
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) scale(0.9) rotate(-3deg); opacity: 0.85; }
            100% { transform: translateX(-50%) scale(1.1) rotate(3deg); opacity: 1; }
        }

        .action-prompt {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 10px;
            letter-spacing: 0.15em;
            min-height: 24px;
            cursor: pointer;
            z-index: 1;
        }

        .lighter-area {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: none;
            align-items: center;
            gap: 10px;
            z-index: 10;
            user-select: none;
            touch-action: none;
        }

        .lighter-comment {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.1em;
            white-space: nowrap;
            font-family: 'Noto Serif TC', serif;
        }

        .lighter-custom {
            width: 60px;
            height: 90px;
            cursor: grab;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.8));
            transition: transform 0.2s;
        }
        .lighter-custom:active {
            cursor: grabbing;
        }
        .lighter-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .drag-tip {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.4);
            margin-top: 10px;
            letter-spacing: 0.1em;
            z-index: 1;
        }

        .wish-text-box {
            min-height: 50px;
            text-align: center;
            margin-top: 10px;
            font-size: 1.05rem;
            letter-spacing: 0.15em;
            color: #dcdcdc;
            line-height: 1.8;
            z-index: 1;
        }

        /* ================= 頁面三：拍立得藝廊 ================= */
        #page-gallery {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            align-items: center;
        }

        .gallery-title {
            font-size: 1.1rem;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 40px;
            font-weight: 300;
        }

        .polaroids-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 30px;
            width: 100%;
            padding: 0 10px;
            margin-bottom: 30px;
        }

        .polaroid {
            background: #f4f4f2;
            color: #222;
            padding: 12px 12px 20px 12px;
            border-radius: 3px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.4s;
            position: relative;
        }

        .polaroid:hover {
            transform: translateY(-8px) rotate(1deg);
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
        }

        .polaroid-img {
            width: 100%;
            height: 160px;
            background: #2a2a2a;
            object-fit: cover;
            margin-bottom: 12px;
            filter: grayscale(20%) contrast(105%);
        }

        .polaroid-caption {
            font-family: 'Caveat', 'Noto Serif TC', cursive;
            font-size: 1.15rem;
            text-align: center;
            color: #333;
            letter-spacing: 0.05em;
        }

        .gallery-next-container {
            margin-top: 20px;
            opacity: 0.3;
            pointer-events: none;
            transition: opacity 0.5s;
        }
        .gallery-next-container.unlocked {
            opacity: 1;
            pointer-events: auto;
        }

        /* ================= 頁面四：信封信紙 ================= */
        #page-letter {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            align-items: center;
            text-align: center;
        }

        .letter-container {
            position: relative;
            width: 100%;
            max-width: 440px;
            height: 480px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }

        .letter-paper {
            position: absolute;
            width: 340px;
            height: 420px;
            background: #fbfbf9;
            color: #2c2c2c;
            padding: 40px 30px;
            border-radius: 2px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: left;
            font-size: 0.95rem;
            line-height: 2;
            letter-spacing: 0.08em;
            transform: translateY(0px);
            transition: transform 1.2s cubic-bezier(0.2, 1.2, 0.3, 1), box-shadow 1.2s;
            z-index: 1;
            overflow-y: auto;
        }

        .letter-paper.pulled {
            transform: translateY(-80px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .letter-paper h3 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            letter-spacing: 0.15em;
            color: #111;
        }

        .envelope {
            position: absolute;
            width: 360px;
            height: 240px;
            background: #232323;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 4px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            z-index: 3;
            cursor: pointer;
            transition: transform 0.8s ease, opacity 0.8s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .envelope.torn {
            transform: translateY(180px) scale(0.95);
            opacity: 0.2;
            pointer-events: none;
        }

        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 120px;
            background: #2a2a2a;
            clip-path: polygon(0 0, 50% 100%, 100% 0);
            border-top: 1px solid rgba(255,255,255,0.2);
            transition: transform 0.6s ease;
            transform-origin: top;
        }

        .envelope.torn .envelope-flap {
            transform: rotateX(180deg);
        }

        .envelope-text {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.6);
            letter-spacing: 0.2em;
            margin-top: 30px;
            z-index: 4;
        }

        .next-step-container {
            margin-top: 25px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
        }
        .next-step-container.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .subtle-link-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Noto Serif TC', serif;
            font-size: 0.95rem;
            letter-spacing: 0.15em;
            cursor: pointer;
            padding: 8px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s;
        }
        .subtle-link-btn:hover {
            color: #fff;
            border-color: #fff;
        }

        /* ================= 頁面五：80% 視窗大小的左右滑動相簿 ================= */
        #page-slider {
            width: 100vw;
            height: 100vh;
            max-width: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slider-wrapper {
            position: relative;
            width: 80vw;
            height: 80vh;
            overflow: hidden;
            background: #141414;
            border-radius: 8px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .slider-track {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .slide-item {
            min-width: 80vw;
            height: 80vh;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .slide-img {
            width: 100%;
            height: calc(80vh - 80px);
            object-fit: cover;
        }

        .slide-caption-overlay {
            width: 100%;
            height: 80px;
            background: #181818;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            letter-spacing: 0.15em;
            color: #dcdcdc;
            font-family: 'Noto Serif TC', serif;
        }

        .slider-hint {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.5);
            letter-spacing: 0.2em;
            z-index: 10;
            pointer-events: none;
        }

        /* 彈窗 Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 100;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #141414;
            border: 1px solid rgba(255, 255, 255, 0.15);
            max-width: 480px;
            width: 100%;
            padding: 35px;
            border-radius: 4px;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.9);
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            color: rgba(255,255,255,0.5);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.3s;
        }
        .modal-close:hover {
            color: #fff;
        }

        .modal-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            margin-bottom: 20px;
            border-radius: 2px;
        }

        .modal-title {
            font-size: 1.1rem;
            letter-spacing: 0.1em;
            margin-bottom: 12px;
            color: #f0f0f0;
        }

        .modal-story {
            font-size: 0.95rem;
            line-height: 1.8;
            color: #b5b5b5;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

    <!-- 頁面一：首頁 -->
    <div id="page-home" class="page active">
        <div class="home-content">
            <button class="light-up-btn" id="btn-light-up">Light up</button>
            <div class="producer-credit">produced by small._.gg</div>
        </div>
    </div>

    <!-- 頁面二：蛋糕與打火機 -->
    <div id="page-cake" class="page">
        <div class="glow-background"></div>
        <div class="action-prompt" id="action-prompt">請點擊一下</div>

        <div class="stage-container" id="stage-container">
            <div class="cake-custom-wrapper" id="cake-wrapper">
                <img src="ji.jpg" alt="Birthday Cake" class="cake-img" id="cake-img">
                
                <div class="candles-container">
                    <div class="candle" onclick="extinguishSingleCandle(0)"><div class="flame" id="f0"></div></div>
                    <div class="candle" onclick="extinguishSingleCandle(1)"><div class="flame" id="f1"></div></div>
                    <div class="candle" onclick="extinguishSingleCandle(2)"><div class="flame" id="f2"></div></div>
                    <div class="candle" onclick="extinguishSingleCandle(3)"><div class="flame" id="f3"></div></div>
                    <div class="candle" onclick="extinguishSingleCandle(4)"><div class="flame" id="f4"></div></div>
                </div>
            </div>

            <div class="lighter-area" id="lighter-area">
                <span class="lighter-comment">這是點蠟燭不是點煙的</span>
                <div class="lighter-custom" id="lighter" draggable="true">
                    <img src="ㄏㄍㄜ.png" alt="Lighter" class="lighter-img">
                </div>
            </div>
        </div>

        <div class="drag-tip" id="drag-tip" style="display:none;">拖動打火機即可點火</div>
        <div class="wish-text-box" id="wish-text-box"></div>
    </div>

    <!-- 頁面三：拍立得藝廊 -->
    <div id="page-gallery" class="page">
        <div class="gallery-title">Moments (點擊各張照片看故事)</div>
        <div class="polaroids-grid">
            <div class="polaroid" onclick="readStory(1)">
                <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=600&q=80" alt="Memory 1" class="polaroid-img">
                <div class="polaroid-caption">那天一起走的夜路</div>
            </div>
            <div class="polaroid" onclick="readStory(2)">
                <img src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=600&q=80" alt="Memory 2" class="polaroid-img">
                <div class="polaroid-caption">笑得很開心的小事</div>
            </div>
            <div class="polaroid" onclick="readStory(3)">
                <img src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=600&q=80" alt="Memory 3" class="polaroid-img">
                <div class="polaroid-caption">慶祝彼此的笨拙</div>
            </div>
            <div class="polaroid" onclick="readStory(4)">
                <img src="https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&w=600&q=80" alt="Memory 4" class="polaroid-img">
                <div class="polaroid-caption">未完待續的日常</div>
            </div>
        </div>
        
        <div class="gallery-next-container" id="gallery-next-container">
            <button class="light-up-btn" id="btn-goto-letter">我想好好祝福你</button>
        </div>
    </div>

    <!-- 頁面四：信封信紙 -->
    <div id="page-letter" class="page">
        <div class="gallery-title">請慢慢打開信封</div>
        <div class="letter-container">
            <div class="letter-paper" id="letter-paper">
                <h3>親愛的：</h3>
                <p>希望你在每一個普通的日子裡，都能夠感受到被世界溫柔以待。不用急著成為完美的大人，只要照著自己的節奏往前走就好。願你所有的願望都能閃閃發光，生日快樂。</p>
            </div>
            <div class="envelope" id="envelope" onclick="tearEnvelope()">
                <div class="envelope-flap"></div>
                <div class="envelope-text">點擊撕開信封</div>
            </div>
        </div>
        <div class="next-step-container" id="letter-next-container">
            <button class="subtle-link-btn" id="btn-goto-slider">觀看回憶相簿</button>
        </div>
    </div>

    <!-- 頁面五：80% 視窗大小的左右滑動相簿 -->
    <div id="page-slider" class="page">
        <div class="slider-hint">← 左右滑動瀏覽回憶 →</div>
        <div class="slider-wrapper" id="slider-wrapper">
            <div class="slider-track" id="slider-track">
                <div class="slide-item">
                    <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=1200&q=80" class="slide-img">
                    <div class="slide-caption-overlay">一起走過的每一條街</div>
                </div>
                <div class="slide-item">
                    <img src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=1200&q=80" class="slide-img">
                    <div class="slide-caption-overlay">那些閃閃發光的時刻</div>
                </div>
                <div class="slide-item">
                    <img src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=1200&q=80" class="slide-img">
                    <div class="slide-caption-overlay">笑著鬧著的日常風景</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 故事彈窗 Modal -->
    <div class="modal-overlay" id="story-modal" onclick="closeStory(event)">
        <div class="modal-card" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModalDirect()">&times;</button>
            <img id="modal-img" src="" alt="Story Image" class="modal-img">
            <h3 id="modal-title" class="modal-title"></h3>
            <p id="modal-story" class="modal-story"></p>
        </div>
    </div>

    <!-- 真實打火機音效 -->
    <audio id="lighter-audio" src="https://cdn.freesound.org/previews/415/415751_5121236-lq.mp3" preload="auto"></audio>

    <script>
        const lighterAudio = document.getElementById('lighter-audio');
        function playLighterSound() {
            try {
                lighterAudio.currentTime = 0;
                lighterAudio.play();
            } catch(e) {}
        }

        let audioCtx = null;
        function playClickSound() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(350, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
